[package]
name = "mini-aec-lab"
description = "Diagnostic CLI for the MiniAEC audio pipeline"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
hound = "3.5.1"
mini-aec-engine = { path = "../mini-aec-engine" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
webrtc-audio-processing = { version = "~2.1.0", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
mini-aec-transport = { path = "../mini-aec-transport" }
mini-aec-windows-transport = { path = "../mini-aec-windows-transport" }
wasapi = "0.23.0"

[lints]
workspace = true
